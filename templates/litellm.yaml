tosca_definitions_version: tosca_simple_yaml_1_0

imports:
  - grycap_custom_types: https://raw.githubusercontent.com/grycap/tosca/main/custom_types.yaml

description: TOSCA template for deploying a Ollama + Open WebUI VM

metadata:
  template_version: "1.0.0"
  template_name: vLLM + LiteLLM + Open WebUI
  display_name: Install vLLM + LiteLLM + Open WebUI
  icon: images/litellm.png
  tabs:
    vLLM:
      - vllm_nvidia_support
      - vllm_driver_version:
          enabled_by: vllm_nvidia_support
      - vllm_tensor_parallel_size:
          enabled_by: vllm_nvidia_support
      - vllm_model_name
      - vllm_max_model_len
      - vllm_memory_utilization
      - vllm_tool_call_parser
      - litellm_admin_email
  parents:
    - simple-node-disk.yml

topology_template:

  inputs:

    vllm_nvidia_support:
      type: boolean
      description: Flag to add the NVIDIA runtime to the vLLM installation
      default: false

    vllm_driver_version:
      type: string
      description: NVIDIA Driver version to install
      default: "535"

    vllm_tensor_parallel_size:
      type: integer
      description: Number of GPUs to use for tensor parallelism (1 means no tensor parallelism)
      default: 1

    vllm_model_name:
      type: string
      description: Name of the AI model to install (see https://docs.vllm.ai/en/latest/models/supported_models/)
      default: "Qwen/Qwen3-0.6B"
      required: yes
    
    vllm_tool_call_parser:
      type: string
      description: Tool call parser to use for the vLLM model (see https://docs.vllm.ai/en/latest/features/tool_calling/)
      default: "qwen3_xml"
    
    vllm_max_model_len:
      type: integer
      description: Maximum length of the model (in tokens)
      default: 8192
      constraints:
        - valid_values: [ 8192, 16384, 32768 ]
    
    vllm_memory_utilization:
      type: float
      description: |-
        The fraction of memory to assign to the vLLM container (0.1 to 1.0).
        For example, 0.6 means 60% of the available memory will be assigned to the vLLM container.
      default: 0.6
      constraints:
        - max_value: 1.0
        - min_value: 0.1

    litellm_admin_email:
      type: string
      description: Email address of the LiteLLM admin user
      default: "jonhdoe@server.com"

    # override simple-node-disk ports

    disk_size:
      type: scalar-unit.size
      description: Size of the root disk of the VM (in case of 0 disk will no be resized)
      default: 50 GiB
      constraints:
        - valid_values: [ 50 GiB, 100 GiB, 200 GiB, 0 GiB ]

    ports:
      type: map
      entry_schema:
        type: PortSpec
      description: |
        List of ports to be Opened in the Cloud site (eg. 22,80,443,2000:2100).
        You can also include the remote CIDR (eg. 8.8.0.0/24).
      default:
        http_port:
          source: 80
          protocol: tcp
        https_port:
          source: 443
          protocol: tcp


  node_templates:

    vllm:
      type: tosca.nodes.SoftwareComponent
      requirements:
        - host: simple_node
      artifacts:
        docker_role:
          file: grycap.docker
          type: tosca.artifacts.AnsibleGalaxy.role
      interfaces:
        Standard:
          configure:
            implementation: https://raw.githubusercontent.com/grycap/tosca/main/artifacts/litellm.yml
            inputs:
              nvidia_support: { get_input: vllm_nvidia_support }
              vllm_driver_version: { get_input: vllm_driver_version }
              model_name: { get_input: vllm_model_name }
              tensor_parallel_size: { get_input: vllm_tensor_parallel_size }
              max_model_len: { get_input: vllm_max_model_len }
              memory_utilization: { get_input: vllm_memory_utilization }
              tool_call_parser: { get_input: vllm_tool_call_parser }
              node_public_address: { get_attribute: [ simple_node, public_address, 0 ] }
              dns_node_name: { get_input: dns_name }
              admin_email: { get_input: litellm_admin_email }

  outputs:
    openwebui_url:
      value: { concat: [ "https://", { get_attribute: [ simple_node, public_address, 0 ] }, "/"] }
    openwebui_dns_url:
      value: { concat: [ "https://", { get_input: dns_name }, "/"] }
