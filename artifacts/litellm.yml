---
- hosts: localhost
  connection: local
  vars:
    openwebui_cert_email: "{{ user_cert_email | default('jhondoe@server.com') }}"
    traefik_host: "{{ node_public_address }}"
    openwebui_image_tag: "main"
    # vLLM downloads this Hugging Face model on first start.
    vllm_model_name: "{{ model_name | default('Qwen/Qwen3-0.6B') }}"
    vllm_tensor_parallel_size: "{{ tensor_parallel_size | default('1') }}"
    vllm_max_model_len: "{{ max_model_len | default('8192') }}"
    vllm_nvidia_support: "{{ nvidia_support | default(false) | bool }}"
    vllm_memory_utilization: "{{ memory_utilization | default(0.6) }}"
    vllm_tool_call_parser: "{{ tool_call_parser | default('qwen3_xml') }}"
    litellm_enabled: "{{ install_litellm | default(true) | bool }}"
    litellm_image_tag: "main-stable"
    litellm_master_key: "{{ litellm_key | default('') }}"
    litellm_db_password: "{{ db_password | default('') }}"
    litellm_path_prefix: "/litellm"
    litellm_admin_email: "{{ admin_email | default(openwebui_cert_email) }}"
    litellm_admin_password: "{{ admin_password | default('') }}"
  roles:
    - role: 'grycap.docker'
      vars:
        docker_nvidia_support: "{{ vllm_nvidia_support }}"
        docker_nvidia_driver_version: "{{ vllm_driver_version | default('580') }}"
  tasks:

    - name: Detect CPU instruction-set flags for CPU vLLM
      ansible.builtin.shell: "awk '/^flags[[:space:]]*:/{print; exit} /^Features[[:space:]]*:/{print; exit}' /proc/cpuinfo"
      register: vllm_cpu_flags
      changed_when: false
      when: not (vllm_nvidia_support | bool)

    - name: Require AVX and AVX2 for CPU vLLM
      ansible.builtin.assert:
        that:
          - "' avx ' in (' ' ~ vllm_cpu_flags.stdout ~ ' ')"
          - "' avx2 ' in (' ' ~ vllm_cpu_flags.stdout ~ ' ')"
        fail_msg: >-
          This CPU does not expose AVX and AVX2. The CPU vLLM image cannot run
          on this node; enable NVIDIA support or use a vLLM image built for
          this processor.
      when: not (vllm_nvidia_support | bool)

    - name: Generate LiteLLM master key if not provided
      set_fact:
        litellm_master_key: "sk-{{ lookup('password', '/var/tmp/litellm_master_key length=32 chars=ascii_letters,digits') }}"
      when: litellm_enabled | bool and litellm_master_key == ''

    - name: Generate LiteLLM DB password if not provided
      set_fact:
        litellm_db_password: "{{ lookup('password', '/var/tmp/litellm_db_password length=24 chars=ascii_letters,digits') }}"
      when: litellm_enabled | bool and litellm_db_password == ''

    - name: Generate LiteLLM admin password if not provided
      set_fact:
        # LiteLLM's default password policy requires upper/lower/digit/special chars.
        litellm_admin_password: "{{ lookup('password', '/var/tmp/litellm_admin_password length=23 chars=ascii_letters,digits') }}!"
      when: litellm_enabled | bool and litellm_admin_password == ''

    - name: Set traefik host to DNS name
      set_fact:
        traefik_host: "{{ dns_node_name }}"
      when: dns_node_name is defined and dns_node_name != ""

    - name: Create open-webui directory
      file:
        path: /opt/openwebui
        state: directory
        mode: '0755'

    - name: Set vLLM image
      set_fact:
        vllm_image: "{{ 'vllm/vllm-openai:latest' if vllm_nvidia_support else 'vllm/vllm-openai-cpu:latest-x86_64' }}"

    - name: Create LiteLLM config file
      copy:
        content: |
          model_list:
            - model_name: {{ vllm_model_name | to_json }}
              litellm_params:
                model: {{ ('hosted_vllm/' ~ vllm_model_name) | to_json }}
                api_base: "http://vllm:8000/v1"
                api_key: "EMPTY"
          general_settings:
            master_key: {{ litellm_master_key | to_json }}
            disable_env_credential_login: true
        dest: /opt/openwebui/litellm-config.yaml
        mode: '0644'
      when: litellm_enabled | bool

    - name: Create docker-compose file
      copy:
        content: |
          services:
            vllm:
              image: {{ vllm_image }}
              container_name: vllm
              restart: always
              ipc: host
              expose:
                - "8000"
              ports:
                - "127.0.0.1:8000:8000"
              volumes:
                - ./huggingface:/root/.cache/huggingface
                - ./vllm-cache:/root/.cache/vllm
              command:
                - "--model"
                - {{ vllm_model_name | to_json }}
                - "--host"
                - "0.0.0.0"
                - "--port"
                - "8000"
                - "--tensor-parallel-size"
                - "{{ vllm_tensor_parallel_size }}"
                - "--max-model-len"
                - "{{ vllm_max_model_len }}"
                - "--gpu-memory-utilization"
                - "{{ vllm_memory_utilization }}"
                - "--enable-auto-tool-choice"
                - "--tool-call-parser"
                - "{{ vllm_tool_call_parser }}"
              networks:
                - backend
              {% if vllm_nvidia_support | bool %}
              # Add NVIDIA runtime support for vLLM container
              deploy:
                resources:
                  reservations:
                    devices:
                      - driver: nvidia
                        capabilities: [gpu]
                        count: all
              {% endif %}
              # Healthcheck to ensure the vLLM service is up and running
              healthcheck:
                test:
                  - CMD
                  - python3
                  - -c
                  - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 1500s
            {% if litellm_enabled | bool %}
            # LiteLLM service configuration
            litellm-db:
              image: postgres:16-alpine
              container_name: litellm-db
              restart: always
              environment:
                - POSTGRES_DB=litellm
                - POSTGRES_USER=litellm
                - POSTGRES_PASSWORD={{ litellm_db_password }}
              volumes:
                - ./litellm-db:/var/lib/postgresql/data
              networks:
                - backend
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
                interval: 10s
                timeout: 5s
                retries: 5
            litellm:
              image: ghcr.io/berriai/litellm:{{ litellm_image_tag }}
              container_name: litellm
              restart: always
              expose:
                - "4000"
              ports:
                - "127.0.0.1:4000:4000"
              volumes:
                - ./litellm-config.yaml:/app/config.yaml
              command:
                - "--config"
                - "/app/config.yaml"
                - "--port"
                - "4000"
              environment:
                - DATABASE_URL=postgresql://litellm:{{ litellm_db_password }}@litellm-db:5432/litellm
                - SERVER_ROOT_PATH={{ litellm_path_prefix }}
              depends_on:
                - vllm
                - litellm-db
              networks:
                - backend
                - frontend
              # Healthcheck to ensure the LiteLLM service is up and running
              healthcheck:
                test:
                  - CMD
                  - python3
                  - -c
                  - "import urllib.request; urllib.request.urlopen('http://localhost:4000{{ litellm_path_prefix }}/health/readiness', timeout=5)"
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 60s
              labels:
                - "traefik.enable=true"
                - "traefik.http.routers.litellm.service=litellm"
                - "traefik.http.routers.litellm.rule=Host(`{{ traefik_host }}`) && PathPrefix(`{{ litellm_path_prefix }}`)"
                - "traefik.http.routers.litellm.entrypoints=websecure"
                - "traefik.http.routers.litellm.tls.certresolver=myresolver"
                - "traefik.http.routers.litellm.tls=true"
                - "traefik.http.services.litellm.loadbalancer.server.port=4000"
                - "traefik.docker.network=openwebui_frontend"
            {% endif %}
            # OpenWebUI service configuration
            openwebui:
              image: ghcr.io/open-webui/open-webui:{{ openwebui_image_tag }}
              container_name: open-webui
              restart: always
              expose:
                - "8080"
              volumes:
                - .:/app/backend/data
              environment:
                - ENABLE_OLLAMA_API=false
                - ENABLE_OPENAI_API=true
                {% if litellm_enabled | bool %}
                # Use LiteLLM as the backend for OpenWebUI
                - OPENAI_API_BASE_URLS=http://litellm:4000{{ litellm_path_prefix }}/v1
                - OPENAI_API_KEYS={{ litellm_master_key }}
                {% else %}
                # Use vLLM as the backend for OpenWebUI
                - OPENAI_API_BASE_URLS=http://vllm:8000/v1
                - OPENAI_API_KEYS=EMPTY
                {% endif %}
              # Set dependencies based on whether LiteLLM is enabled
              depends_on:
                {% if litellm_enabled | bool %}
                # If LiteLLM is enabled, OpenWebUI depends on LiteLLM and vLLM
                - litellm
                {% else %}
                # If LiteLLM is not enabled, OpenWebUI depends only on vLLM
                - vllm
                {% endif %}
              # Network configuration
              networks:
                - backend
                - frontend
              labels:
                - "traefik.enable=true"
                - "traefik.http.routers.openwebui.service=openwebui"
                - "traefik.http.routers.openwebui.rule=Host(`{{ traefik_host }}`)"
                - "traefik.http.routers.openwebui.entrypoints=websecure"
                - "traefik.http.routers.openwebui.tls.certresolver=myresolver"
                - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
                - "traefik.docker.network=openwebui_frontend"
                - "traefik.http.routers.openwebui.tls=true"
            traefik:
              image: "traefik:v2.11"
              container_name: "traefik"
              restart: always
              command:
              #- "--log.level=DEBUG"
              - "--accesslog=true"
              - "--api.insecure=true"
              - "--providers.docker=true"
              - "--providers.docker.exposedbydefault=false"
              - "--entrypoints.web.address=:80"
              - "--entrypoints.websecure.address=:443"
              - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
              - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
              - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
              - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
              - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
              #- "--certificatesresolvers.myresolver.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
              - "--certificatesresolvers.myresolver.acme.email={{ openwebui_cert_email }}"
              - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
              - "--serversTransport.forwardingTimeouts.dialTimeout=30s"
              - "--serversTransport.forwardingTimeouts.responseHeaderTimeout=0s"
              - "--serversTransport.forwardingTimeouts.idleConnTimeout=300s"
              ports:
              - "80:80"
              - "443:443"
              - "8080:8080"
              volumes:
              - "./letsencrypt:/letsencrypt"
              - "/var/run/docker.sock:/var/run/docker.sock:ro"
              networks:
              - frontend
          networks:
              frontend:
                  driver: bridge
              backend:
                  driver: bridge
        dest: /opt/openwebui/docker-compose.yaml
        mode: '644'

    - name: Exec docker-compose up
      community.docker.docker_compose_v2:
        project_src: /opt/openwebui/
        state: present

    - name: Wait for vLLM health endpoint
      uri:
        url: http://127.0.0.1:8000/health
        method: GET
        status_code: 200
        timeout: 5
      register: vllm_health
      until: (vllm_health.status | default(0)) == 200
      retries: 240
      delay: 10

    - name: Wait for LiteLLM health endpoint
      uri:
        url: "http://127.0.0.1:4000{{ litellm_path_prefix }}/health/readiness"
        method: GET
        status_code: 200
        timeout: 5
      register: litellm_health
      until: (litellm_health.status | default(0)) == 200
      retries: 60
      delay: 5
      when: litellm_enabled | bool

    - name: Create LiteLLM proxy admin account with its own password
      uri:
        url: "http://127.0.0.1:4000{{ litellm_path_prefix }}/user/update"
        method: POST
        headers:
          Authorization: "Bearer {{ litellm_master_key }}"
        body_format: json
        body:
          user_email: "{{ litellm_admin_email }}"
          user_role: "proxy_admin"
          password: "{{ litellm_admin_password }}"
        status_code: 200
      when: litellm_enabled | bool

    - name: llitellm_master_key
      debug:
        msg: "{{ litellm_master_key }}"
      when: litellm_enabled | bool
