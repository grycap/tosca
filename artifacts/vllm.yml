---
- hosts: localhost
  connection: local
  vars:
    openwebui_cert_email: "{{ user_cert_email | default('jhondoe@server.com') }}"
    traefik_host: "{{ node_public_address }}"
    openwebui_image_tag: "main"
    # This recipe uses the NVIDIA GPU image and serves one Hugging Face model.
    vllm_image_tag: "latest"
    # Models to cache on disk; this instance serves the first model in the list.
    vllm_models_name: "{{ models_name | default(['Qwen/Qwen3-0.6B']) }}"
    vllm_tensor_parallel_size: "{{ tensor_parallel_size | default('1') }}"
    vllm_max_model_len: "{{ max_model_len | default('2048') }}"
    vllm_nvidia_support: "{{ docker_nvidia_support | default(false) | bool }}"
  roles:
    - role: 'grycap.docker'
      vars:
        docker_nvidia_support: "{{ vllm_nvidia_support }}"
        docker_nvidia_driver_version: "{{ vllm_driver_version | default('580') }}"
  tasks:

    - name: Set traefik host to DNS name
      set_fact:
        traefik_host: "{{ dns_node_name }}"
      when: dns_node_name is defined and dns_node_name != ""

    - name: Create open-webui directory
      file:
        path: /opt/openwebui
        state: directory
        mode: '0755'

    - name: Create docker-compose file
      copy:
        content: |
          services:
            vllm:
              image: vllm/vllm-openai:{{ vllm_image_tag }}
              container_name: vllm
              restart: always
              ipc: host
              expose:
                - "8000"
              volumes:
                - ./huggingface:/root/.cache/huggingface
                - ./vllm-cache:/root/.cache/vllm
              command:
                - "--model"
                - {{ vllm_models_name[0] | to_json }}
                - "--host"
                - "0.0.0.0"
                - "--port"
                - "8000"
                - "--tensor-parallel-size"
                - "{{ vllm_tensor_parallel_size }}"
                - "--max-model-len"
                - "{{ vllm_max_model_len }}"
              networks:
                - backend
              {% if vllm_nvidia_support | bool %}
              deploy:
                resources:
                  reservations:
                    devices:
                      - driver: nvidia
                        capabilities: [gpu]
                        count: all
              {% endif %}
              healthcheck:
                test:
                  - CMD
                  - python3
                  - -c
                  - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 1500s
            openwebui:
              image: ghcr.io/open-webui/open-webui:{{ openwebui_image_tag }}
              container_name: open-webui
              restart: always
              expose:
                - "8080"
              volumes:
                - .:/app/backend/data
              environment:
                - ENABLE_OLLAMA_API=false
                - ENABLE_OPENAI_API=true
                - OPENAI_API_BASE_URLS=http://vllm:8000/v1
                - OPENAI_API_KEYS=EMPTY
              depends_on:
                vllm:
                  condition: service_healthy
              networks:
                - backend
                - frontend
              labels:
                - "traefik.enable=true"
                - "traefik.http.routers.openwebui.service=openwebui"
                - "traefik.http.routers.openwebui.rule=Host(`{{ traefik_host }}`)"
                - "traefik.http.routers.openwebui.entrypoints=websecure"
                - "traefik.http.routers.openwebui.tls.certresolver=myresolver"
                - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
                - "traefik.docker.network=openwebui_frontend"
                - "traefik.http.routers.openwebui.tls=true"
            traefik:
              image: "traefik:v2.11"
              container_name: "traefik"
              restart: always
              command:
              #- "--log.level=DEBUG"
              - "--accesslog=true"
              - "--api.insecure=true"
              - "--providers.docker=true"
              - "--providers.docker.exposedbydefault=false"
              - "--entrypoints.web.address=:80"
              - "--entrypoints.websecure.address=:443"
              - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
              - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
              - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
              - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
              - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
              #- "--certificatesresolvers.myresolver.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
              - "--certificatesresolvers.myresolver.acme.email={{ openwebui_cert_email }}"
              - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
              - "--serversTransport.forwardingTimeouts.dialTimeout=30s"
              - "--serversTransport.forwardingTimeouts.responseHeaderTimeout=0s"
              - "--serversTransport.forwardingTimeouts.idleConnTimeout=300s"
              ports:
              - "80:80"
              - "443:443"
              - "8080:8080"
              volumes:
              - "./letsencrypt:/letsencrypt"
              - "/var/run/docker.sock:/var/run/docker.sock:ro"
              networks:
              - frontend
          networks:
              frontend:
                  driver: bridge
              backend:
                  driver: bridge
        dest: /opt/openwebui/docker-compose.yaml
        mode: '644'

    - name: Pre-download Hugging Face models with the HF CLI
      community.docker.docker_container:
        name: "vllm-model-download-{{ item | replace('/', '-') | replace(':', '-') }}"
        image: "vllm/vllm-openai:{{ vllm_image_tag }}"
        entrypoint: hf
        command:
          - download
          - "{{ item }}"
          - --cache-dir
          - /root/.cache/huggingface/hub
        volumes:
          - /opt/openwebui/huggingface:/root/.cache/huggingface
        auto_remove: true
        detach: false
        state: started
      # Download all listed models without duplicates.
      # snapshot_download reuses cached files on subsequent runs.
      loop: "{{ vllm_models_name }}"

    - name: Exec docker-compose up
      community.docker.docker_compose_v2:
        project_src: /opt/openwebui/
        state: present
        wait: true
        wait_timeout: 1800
